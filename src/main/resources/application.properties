spring.application.name=lmsPlatform

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
#allow table name
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.format_sql=true
server.address=0.0.0.0
server.port=8080

hashids.salt=${Hashids_salt}
hashids.min-length=${Hashids_min-length}
APP_SIGNER_KEY=${Signer_key}
APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
APP_SEED_ADMIN_PASSWORD=${APP_SEED_ADMIN_PASSWORD}

spring.ai.google.genai.api-key=${Ai_api_key}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.frontend-url=${FRONTEND_URL}
app.jwt.expiration-minutes=15
app.jwt.refresh-expiration-days=7